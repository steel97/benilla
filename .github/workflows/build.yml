name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - ios-test
  pull_request:
    branches:
      - ios-test

jobs:
  desktop:
    name: desktop
    runs-on: ${{ matrix.runner }}
    environment: desktop
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: benilla-macarm
            binary: benilla
            runner: macos-latest
          - target: x86_64-apple-darwin
            artifact: benilla-macx86
            binary: benilla
            runner: macos-26-intel
          - target: x86_64-pc-windows-msvc
            artifact: benilla-win64
            binary: benilla.exe
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            artifact: benilla-winarm
            binary: benilla.exe
            runner: windows-11-arm
          - target: x86_64-unknown-linux-gnu
            artifact: benilla-linux64
            binary: benilla
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            artifact: benilla-linuxarm
            binary: benilla
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Install dependencies
        run: |
          rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p benilla

      - name: Rename and move artifact
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} ./${{ matrix.artifact }}
          if [ "${{ matrix.binary }}" = "benilla.exe" ]; then
            mv ./${{ matrix.artifact }} ./${{ matrix.artifact }}.exe
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.binary == 'benilla.exe' && '.exe' || '' }}

  ios:
    name: ios
    runs-on: macos-latest
    environment: ios
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Install dependencies
        run: |
          brew install ldid
      - name: Build executable
        run: |
          rustup target add aarch64-apple-ios
          cd mobile
          xcodebuild \
          -project benilla.xcodeproj \
          -scheme benilla \
          -sdk iphoneos \
          -verbose \
          archive -archivePath ./benilla.xcarchive \
          CODE_SIGNING_REQUIRED=NO \
          AD_HOC_CODE_SIGNING_ALLOWED=YES \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM=XYZ0123456 \
          ORG_IDENTIFIER=org.benilla | xcpretty && exit ${PIPESTATUS[0]}
      - name: Fakesign app
        run: |
          cd mobile
          ldid -Sbenilla.entitlements benilla.xcarchive/Products/Applications/benilla.app/benilla
      - name: Build ipa
        run: |
          cd mobile
          mkdir Payload
          mkdir Payload/benilla.app
          cp -R benilla.xcarchive/Products/Applications/benilla.app/ Payload/benilla.app/
          zip -r ../benilla.ipa Payload
      - name: Cleanup
        run: |
          cd mobile
          rm -fr benilla.xcarchive
          rm -fr Payload
      - uses: actions/upload-artifact@v7
        with:
          name: benilla-ios
          path: |
            benilla.ipa

  release:
    name: release
    runs-on: ubuntu-latest
    environment: linux
    needs: [desktop, ios]
    steps:
      - uses: actions/checkout@v6

      - name: Set short git commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: assets
        run: |
          cd crates/benilla-app
          zip -r ../../assets.zip assets

      - uses: actions/download-artifact@v7
        with:
          name: benilla-ios
          path: "./"

      - uses: actions/download-artifact@v7
        with:
          name: benilla-macarm
          path: "./"

      - uses: actions/download-artifact@v7
        with:
          name: benilla-macx86
          path: "./"

      - uses: actions/download-artifact@v7
        with:
          name: benilla-win64
          path: "./"

      - uses: actions/download-artifact@v7
        with:
          name: benilla-winarm
          path: "./"

      - uses: actions/download-artifact@v7
        with:
          name: benilla-linux64
          path: "./"

      - uses: actions/download-artifact@v7
        with:
          name: benilla-linuxarm
          path: "./"

      - name: Create launch scripts
        run: |
          # Define platforms
          platforms=(
            "macarm:benilla-macarm:sh"
            "macx86:benilla-macx86:sh"
            "linux64:benilla-linux64:sh"
            "linuxarm:benilla-linuxarm:sh"
            "win64:benilla-win64.exe:bat"
            "winarm:benilla-winarm.exe:bat"
          )

          for platform in "${platforms[@]}"; do
            IFS=':' read -r name binary ext <<< "$platform"
            
            if [ "$ext" = "sh" ]; then
              echo "#!/bin/bash
          WOW_HOST=127.0.0.1:3724 WOW_BUILTIN=./ ./$binary" > "start_$name.sh"
              chmod +x "start_$name.sh"
            else
              echo "@echo off
          set WOW_HOST=127.0.0.1:3724
          set WOW_BUILTIN=./
          $binary" > "start_$name.bat"
            fi
          done

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.sha_short }}
          files: |
            assets.zip
            benilla.ipa
            benilla-macarm
            benilla-macx86
            benilla-win64
            benilla-winarm
            benilla-linux64
            benilla-linuxarm            
            start_macarm.sh
            start_macx86.sh
            start_linuxarm.sh
            start_linux64.sh
            start_win64.bat
            start_winarm.bat
